# Microsoft Fabric: Delta tables in the lakehouse attached to the notebook.
# Bronze is loaded there by Data Factory copy jobs (STEMStar silos from Postgres, BrainLab files from
# OneLake), so the pipeline starts at Silver.
storage: spark
lakehouse_dir: /lakehouse/default/Tables   # not used by Spark storage; kept for reference
brainlab_source: /lakehouse/default/Files/landing/brainlab
stemstar_source: /lakehouse/default/Files/landing/stemstar
generate_stemstar: false
contracts_dir: /tmp/pipeline_libs/contracts_yaml
seed: 42
kpi_tolerance_pct: 1.0

# Row counts a seed-42 run produces (the same data as config/local.yaml). The observability stage fails
# when a table drifts more than 1% from these.
