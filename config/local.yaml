# Local run on synthetic data: Parquet files under lakehouse/, no cloud account needed.
storage: local
lakehouse_dir: lakehouse
brainlab_source: data/synthetic/brainlab
stemstar_source: data/synthetic/stemstar
generate_stemstar: true      # create the synthetic STEMStar extracts on first run
contracts_dir: contracts
seed: 42
kpi_tolerance_pct: 1.0

