[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stemstar-lakehouse"
version = "1.0.0"
description = "Medallion lakehouse for an education company: data contracts, KPI reconciliation, churn model and Reverse ETL, runnable locally on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg2-binary>=2.9"]
fabric = ["pyspark>=3.5"]

[project.scripts]
pipeline = "pipeline.cli:main"
synthgen = "synthgen.cli:main"
stemstar-synth = "stemstar_synth.__main__:main"

# Install editable (pip install -e ".[dev]"): the pipeline reads config/ and contracts/ from the repo.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
